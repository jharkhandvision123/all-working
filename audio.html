<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customer Audio Notification</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f2f4f7;
        font-family: Arial, sans-serif;
    }

    .box {
        width: 92%;
        max-width: 420px;
        background: white;
        padding: 30px 25px;
        border-radius: 18px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        text-align: center;
    }

    h2 {
        margin-top: 0;
        margin-bottom: 25px;
        color: #222;
    }

    label {
        display: block;
        text-align: left;
        font-size: 16px;
        font-weight: bold;
        margin-bottom: 8px;
    }

    input {
        width: 100%;
        padding: 14px;
        font-size: 19px;
        border: 1px solid #ccc;
        border-radius: 10px;
        outline: none;
        text-align: center;
        margin-bottom: 16px;
    }

    input:focus {
        border-color: #1976d2;
    }

    button {
        width: 100%;
        margin-top: 5px;
        padding: 14px;
        border: none;
        border-radius: 10px;
        background: #1976d2;
        color: white;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #125ca8;
    }

    button:active {
        transform: scale(0.98);
    }

    .stop-btn {
        background: #d32f2f;
        margin-top: 10px;
    }

    .stop-btn:hover {
        background: #b71c1c;
    }

    #status {
        margin-top: 18px;
        min-height: 24px;
        font-size: 14px;
        color: #555;
    }

    #message {
        margin-top: 15px;
        padding: 12px;
        border-radius: 10px;
        background: #f5f5f5;
        font-size: 15px;
        line-height: 1.6;
        display: none;
    }
</style>
</head>

<body>

<div class="box">

    <h2>Customer Audio</h2>

    <label for="customerName">Customer Name</label>

    <input
        type="text"
        id="customerName"
        placeholder="जैसे रुपेश"
        autocomplete="off"
    >

    <label for="amount">Amount दर्ज करें</label>

    <input
        type="number"
        id="amount"
        placeholder="जैसे 2000"
        min="1"
        inputmode="numeric"
    >

    <button onclick="startAudio()">
        ▶ START
    </button>

    <button class="stop-btn" onclick="stopAudio()">
        ■ STOP
    </button>

    <div id="message"></div>

    <div id="status"></div>

</div>

<script>

let voices = [];

// उपलब्ध voices लोड करें
function loadVoices() {
    voices = speechSynthesis.getVoices();
}

speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();


// Hindi Female voice चुनने की कोशिश
function getFemaleHindiVoice() {

    // पहले Hindi female voice खोजें
    let voice = voices.find(v => {

        const name = v.name.toLowerCase();
        const lang = v.lang.toLowerCase();

        return (
            lang.startsWith("hi") &&
            (
                name.includes("female") ||
                name.includes("woman") ||
                name.includes("google")
            )
        );
    });

    if (voice) {
        return voice;
    }

    // कोई Hindi voice
    voice = voices.find(v =>
        v.lang.toLowerCase().startsWith("hi")
    );

    if (voice) {
        return voice;
    }

    // Indian English voice
    voice = voices.find(v =>
        v.lang.toLowerCase() === "en-in"
    );

    return voice || voices[0];
}


// Number को Hindi शब्दों में बदलना
function numberToHindiWords(num) {

    const ones = [
        "",
        "एक",
        "दो",
        "तीन",
        "चार",
        "पाँच",
        "छह",
        "सात",
        "आठ",
        "नौ",
        "दस",
        "ग्यारह",
        "बारह",
        "तेरह",
        "चौदह",
        "पंद्रह",
        "सोलह",
        "सत्रह",
        "अठारह",
        "उन्नीस"
    ];

    const tens = [
        "",
        "",
        "बीस",
        "तीस",
        "चालीस",
        "पचास",
        "साठ",
        "सत्तर",
        "अस्सी",
        "नब्बे"
    ];

    num = parseInt(num);

    if (num < 20) {
        return ones[num];
    }

    if (num < 100) {
        if (num % 10 === 0) {
            return tens[Math.floor(num / 10)];
        }

        const special = {
            21: "इक्कीस",
            22: "बाईस",
            23: "तेईस",
            24: "चौबीस",
            25: "पच्चीस",
            26: "छब्बीस",
            27: "सत्ताईस",
            28: "अट्ठाईस",
            29: "उनतीस",
            31: "इकतीस",
            32: "बत्तीस",
            33: "तैंतीस",
            34: "चौंतीस",
            35: "पैंतीस",
            36: "छत्तीस",
            37: "सैंतीस",
            38: "अड़तीस",
            39: "उनतालीस",
            41: "इकतालीस",
            42: "बयालीस",
            43: "तैंतालीस",
            44: "चवालीस",
            45: "पैंतालीस",
            46: "छियालीस",
            47: "सैंतालीस",
            48: "अड़तालीस",
            49: "उनचास",
            51: "इक्यावन",
            52: "बावन",
            53: "तिरपन",
            54: "चौवन",
            55: "पचपन",
            56: "छप्पन",
            57: "सत्तावन",
            58: "अट्ठावन",
            59: "उनसठ",
            61: "इकसठ",
            62: "बासठ",
            63: "तिरसठ",
            64: "चौंसठ",
            65: "पैंसठ",
            66: "छियासठ",
            67: "सड़सठ",
            68: "अड़सठ",
            69: "उनहत्तर",
            71: "इकहत्तर",
            72: "बहत्तर",
            73: "तिहत्तर",
            74: "चौहत्तर",
            75: "पचहत्तर",
            76: "छिहत्तर",
            77: "सतहत्तर",
            78: "अठहत्तर",
            79: "उनासी",
            81: "इक्यासी",
            82: "बयासी",
            83: "तिरासी",
            84: "चौरासी",
            85: "पचासी",
            86: "छियासी",
            87: "सत्तासी",
            88: "अट्ठासी",
            89: "नवासी",
            91: "इक्यानबे",
            92: "बानबे",
            93: "तिरानबे",
            94: "चौरानबे",
            95: "पचानबे",
            96: "छियानबे",
            97: "सत्तानबे",
            98: "अट्ठानबे",
            99: "निन्यानबे"
        };

        return special[num] || (tens[Math.floor(num / 10)] + " " + ones[num % 10]);
    }

    if (num < 1000) {

        if (num % 100 === 0) {
            return ones[Math.floor(num / 100)] + " सौ";
        }

        return (
            ones[Math.floor(num / 100)] +
            " सौ " +
            numberToHindiWords(num % 100)
        );
    }

    if (num < 100000) {

        const thousand = Math.floor(num / 1000);
        const remainder = num % 1000;

        let result = numberToHindiWords(thousand) + " हज़ार";

        if (remainder > 0) {
            result += " " + numberToHindiWords(remainder);
        }

        return result;
    }

    if (num < 10000000) {

        const lakh = Math.floor(num / 100000);
        const remainder = num % 100000;

        let result = numberToHindiWords(lakh) + " लाख";

        if (remainder > 0) {
            result += " " + numberToHindiWords(remainder);
        }

        return result;
    }

    // बड़ी राशि के लिए numeric रूप
    return num.toLocaleString("en-IN");
}


// START
function startAudio() {

    const nameInput = document.getElementById("customerName");
    const amountInput = document.getElementById("amount");

    const name = nameInput.value.trim();
    const amount = amountInput.value.trim();

    const status = document.getElementById("status");
    const messageBox = document.getElementById("message");

    if (!name) {
        alert("कृपया Customer Name दर्ज करें।");
        nameInput.focus();
        return;
    }

    if (!amount) {
        alert("कृपया Amount दर्ज करें।");
        amountInput.focus();
        return;
    }

    if (Number(amount) <= 0) {
        alert("कृपया सही Amount दर्ज करें।");
        amountInput.focus();
        return;
    }

    // पहले चल रही आवाज बंद करें
    speechSynthesis.cancel();

    const hindiAmount = numberToHindiWords(Number(amount));

    const text =
        "प्रिय ग्राहक, " +
        name +
        " जी, आपके खाते से " +
        hindiAmount +
        " रुपये की राशि निकाल दी गई है।";

    messageBox.innerText = text;
    messageBox.style.display = "block";

    const utterance = new SpeechSynthesisUtterance(text);

    utterance.lang = "hi-IN";

    const selectedVoice = getFemaleHindiVoice();

    if (selectedVoice) {
        utterance.voice = selectedVoice;
    }

    // Natural voice settings
    utterance.rate = 0.82;
    utterance.pitch = 1.08;
    utterance.volume = 1.0;

    utterance.onstart = function () {
        status.innerText = "🔊 Audio चल रहा है...";
    };

    utterance.onend = function () {
        status.innerText = "✓ Audio पूरा हो गया।";
    };

    utterance.onerror = function () {
        status.innerText = "Audio चलाने में समस्या हुई।";
    };

    speechSynthesis.speak(utterance);
}


// STOP
function stopAudio() {

    speechSynthesis.cancel();

    document.getElementById("status").innerText =
        "■ Audio रोक दिया गया।";
}

</script>

</body>
</html>
