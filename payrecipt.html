
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SN A4 Photo Print</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:20px;
  background:#eef1f5;
  font-family:Arial,sans-serif;
}
.container{
  max-width:850px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:10px;
}
h2{text-align:center}
.controls{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
  margin:20px 0;
}
button{
  padding:11px 20px;
  border:0;
  border-radius:6px;
  background:#075e54;
  color:white;
  cursor:pointer;
  font-size:15px;
}
input{max-width:100%}
#preview{
  width:100%;
  overflow:auto;
  background:#ddd;
  padding:10px;
}
#page{
  width:210mm;
  height:297mm;
  background:white;
  margin:auto;
  padding:8mm;
  display:flex;
  flex-direction:column;
}
.photos{
  width:100%;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:3mm;
  align-items:start;
}
.photo{
  width:100%;
  height:auto;
  display:block;
  object-fit:contain;
}
.blank{
  flex:1;
}
@media print{
  @page{
    size:A4 portrait;
    margin:0;
  }
  body{
    padding:0;
    margin:0;
    background:white;
  }
  .container{
    padding:0;
    margin:0;
    width:100%;
  }
  h2,.controls,.note{display:none!important}
  #preview{
    padding:0;
    margin:0;
    overflow:visible;
    background:white;
  }
  #page{
    width:210mm;
    height:297mm;
    padding:8mm;
    margin:0;
    page-break-after:avoid;
  }
}
</style>
</head>

<body>

<div class="container">
<h2>SN A4 Photo Print</h2>

<div class="controls">
<input type="file" id="upload" accept="image/*">
<button onclick="window.print()">Print A4</button>
<button onclick="downloadPDF()">Download PDF</button>
</div>

<p class="note">
फोटो अपलोड करें या कॉपी की हुई फोटो को नीचे पेस्ट करें।
दोनों प्रतियाँ मूल फोटो जैसी रहेंगी।
</p>

<div id="preview">
<div id="page">
<div class="photos">
<img class="photo" id="photo1">
<img class="photo" id="photo2">
</div>
<div class="blank"></div>
</div>
</div>
</div>

<script>
let imageData = "";

const upload = document.getElementById("upload");

function showImage(data){
  imageData = data;
  document.getElementById("photo1").src = data;
  document.getElementById("photo2").src = data;
}

upload.addEventListener("change",function(e){
  const file=e.target.files[0];
  if(!file)return;

  if(!file.type.startsWith("image/")){
    alert("कृपया सही फोटो चुनें");
    return;
  }

  const reader=new FileReader();
  reader.onload=function(event){
    showImage(event.target.result);
  };
  reader.readAsDataURL(file);
});

document.addEventListener("paste",function(e){
  const items=e.clipboardData.items;

  for(let item of items){
    if(item.type.startsWith("image/")){
      const file=item.getAsFile();
      const reader=new FileReader();
      reader.onload=function(event){
        showImage(event.target.result);
      };
      reader.readAsDataURL(file);
      break;
    }
  }
});

async function downloadPDF(){
  if(!imageData){
    alert("पहले फोटो अपलोड करें");
    return;
  }

  await loadPDFLibrary();

  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF("p","mm","a4");

  const img=document.getElementById("photo1");
  await img.decode();

  const pageWidth=194;
  const gap=3;
  const eachWidth=(pageWidth-gap)/2;
  const ratio=img.naturalHeight/img.naturalWidth;
  const height=eachWidth*ratio;

  pdf.addImage(imageData,"JPEG",8,8,eachWidth,height);
  pdf.addImage(imageData,"JPEG",8+eachWidth+gap,8,eachWidth,height);

  pdf.save("SN-A4-Print.pdf");
}

function loadPDFLibrary(){
  return new Promise((resolve,reject)=>{
    if(window.jspdf){resolve();return;}

    const script=document.createElement("script");
    script.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    script.onload=resolve;
    script.onerror=reject;
    document.head.appendChild(script);
  });
}
</script>

</body>
</html>
