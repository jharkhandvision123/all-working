<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SN इंटरनेट ज़ोन</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                linear-gradient(
                    135deg,
                    #ffffff 0%,
                    #fffaf5 35%,
                    #f8fff9 65%,
                    #ffffff 100%
                );
            padding: 20px;
        }

        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 18px;
            margin-bottom: 35px;
        }


        /* =========================
           LOGO
        ========================= */

        .logo {
            width: 72px;
            height: 72px;
            min-width: 72px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;

            background: white;

            font-size: 24px;
            font-weight: 900;

            color: transparent;

            background-image:
                linear-gradient(
                    90deg,
                    #ff671f,
                    #ff671f 33%,
                    #ffffff 33%,
                    #ffffff 66%,
                    #046a38 66%,
                    #046a38
                );

            -webkit-background-clip: text;
            background-clip: text;

            animation: logoColor 4s linear infinite;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.12);
        }


        .logo::before {
            content: "";

            position: absolute;

            inset: -4px;

            border-radius: 50%;

            background:
                conic-gradient(
                    #ff671f,
                    #ffffff,
                    #046a38,
                    #ff671f
                );

            animation: rotateRing 3s linear infinite;

            z-index: -1;
        }


        .logo::after {
            content: "";

            position: absolute;

            inset: 2px;

            background: white;

            border-radius: 50%;

            z-index: -1;
        }


        /* =========================
           LOGO SN
        ========================= */

        .logo span {
            position: relative;

            z-index: 5;

            font-family: Arial, Helvetica, sans-serif;

            font-size: 25px;

            font-weight: 900;

            letter-spacing: -1px;

            background:
                linear-gradient(
                    90deg,
                    #ff671f 0%,
                    #ff671f 32%,
                    #333333 32%,
                    #333333 50%,
                    #046a38 50%,
                    #046a38 82%,
                    #ff671f 100%
                );

            background-size: 250% auto;

            -webkit-background-clip: text;

            background-clip: text;

            -webkit-text-fill-color: transparent;

            animation:
                logoTextShine 3s linear infinite;

            text-shadow: none;
        }


        @keyframes logoTextShine {

            0% {
                background-position: 0% center;
            }

            50% {
                background-position: 100% center;
            }

            100% {
                background-position: 0% center;
            }

        }


        /* =========================
           LOGO ANIMATION
        ========================= */

        @keyframes rotateRing {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }


        @keyframes logoColor {

            0% {
                filter:
                    drop-shadow(
                        0 0 3px rgba(255,103,31,0.6)
                    );
            }

            50% {
                filter:
                    drop-shadow(
                        0 0 8px rgba(0,128,0,0.7)
                    );
            }

            100% {
                filter:
                    drop-shadow(
                        0 0 3px rgba(255,103,31,0.6)
                    );
            }

        }


        /* =========================
           BRAND NAME
        ========================= */

        .brand {
            font-size: 38px;
            font-weight: 900;
            line-height: 1.15;

            background:
                linear-gradient(
                    90deg,
                    #ff671f 0%,
                    #ff671f 30%,
                    #ffffff 42%,
                    #ffffff 50%,
                    #046a38 62%,
                    #046a38 75%,
                    #ff671f 90%,
                    #ffffff 100%
                );

            background-size: 300% auto;

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            animation:
                tricolorShine 5s linear infinite;

            text-shadow:
                0 2px 8px rgba(0,0,0,0.08);
        }


        @keyframes tricolorShine {

            0% {
                background-position: 0% center;
            }

            50% {
                background-position: 100% center;
            }

            100% {
                background-position: 0% center;
            }

        }


        /* =========================
           BUTTON GRID
        ========================= */

        .button-grid {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 20px;

            width: 100%;
        }


        /* =========================
           BUTTON
        ========================= */

        .menu-button {

            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;

            min-height: 78px;

            padding: 15px;

            border-radius: 18px;

            text-decoration: none;

            font-size: 21px;
            font-weight: 800;

            color: #222;

            background: white;

            border: 2px solid transparent;

            box-shadow:
                0 8px 20px rgba(0,0,0,0.10);

            overflow: hidden;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }


        /* Tricolor border */

        .menu-button::before {

            content: "";

            position: absolute;

            inset: 0;

            padding: 2px;

            border-radius: 18px;

            background:
                linear-gradient(
                    120deg,
                    #ff671f,
                    #ffffff,
                    #046a38,
                    #ff671f
                );

            background-size: 300% 300%;

            animation:
                buttonBorder 5s linear infinite;

            -webkit-mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);

            -webkit-mask-composite: xor;

            mask-composite: exclude;

            pointer-events: none;
        }


        /* Shine */

        .menu-button::after {

            content: "";

            position: absolute;

            top: 0;

            left: -120%;

            width: 70%;

            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.85),
                    transparent
                );

            transform: skewX(-20deg);

            animation:
                buttonShine 4s ease-in-out infinite;

            pointer-events: none;
        }


        @keyframes buttonBorder {

            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }

        }


        @keyframes buttonShine {

            0% {
                left: -120%;
            }

            45% {
                left: 140%;
            }

            100% {
                left: 140%;
            }

        }


        .menu-button:hover {

            transform:
                translateY(-5px)
                scale(1.02);

            box-shadow:
                0 14px 28px rgba(0,0,0,0.16);
        }


        .menu-button:active {

            transform:
                translateY(1px)
                scale(0.98);
        }


        /* =========================
           BUTTON NUMBER
        ========================= */

        .button-number {

            position: relative;

            z-index: 2;

            background:
                linear-gradient(
                    90deg,
                    #ff671f,
                    #d94e00,
                    #046a38,
                    #00843d,
                    #ff671f
                );

            background-size: 300% auto;

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            animation:
                numberShine 4s linear infinite;
        }


        @keyframes numberShine {

            0% {
                background-position: 0% center;
            }

            50% {
                background-position: 100% center;
            }

            100% {
                background-position: 0% center;
            }

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            .button-grid {
                grid-template-columns:
                    repeat(2, 1fr);

                gap: 15px;
            }

            .brand {
                font-size: 29px;
            }

            .logo {
                width: 62px;
                height: 62px;
                min-width: 62px;
                font-size: 21px;
            }

            .header {
                gap: 14px;
                margin-bottom: 28px;
            }

            .menu-button {
                min-height: 70px;
                font-size: 19px;
                border-radius: 15px;
            }

        }


        /* =========================
           SMALL MOBILE
        ========================= */

        @media (max-width: 430px) {

            body {
                padding: 14px;
            }

            .brand {
                font-size: 23px;
            }

            .logo {
                width: 54px;
                height: 54px;
                min-width: 54px;
                font-size: 18px;
            }

            .button-grid {
                gap: 12px;
            }

            .menu-button {
                min-height: 65px;
                font-size: 18px;
            }

        }

    </style>

</head>
