<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Text To Voice</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#fff,#f1f1f1);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:700px;
    background:white;
    border-radius:22px;
    padding:25px;
    box-shadow:0 10px 35px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    margin-top:0;
    font-size:30px;
    background:linear-gradient(90deg,#ff9933,#138808);
    -webkit-background-clip:text;
    color:transparent;
}

textarea{
    width:100%;
    height:220px;
    resize:vertical;
    border:2px solid #ddd;
    border-radius:15px;
    padding:18px;
    font-size:18px;
    outline:none;
}

textarea:focus{
    border-color:#138808;
}

label{
    display:block;
    margin-top:18px;
    margin-bottom:7px;
    font-weight:bold;
}

select,
input[type="range"]{
    width:100%;
}

select{
    padding:12px;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:16px;
}

.buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:20px;
}

button{
    flex:1;
    min-width:140px;
    padding:14px;
    border:0;
    border-radius:12px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.speak{
    background:#138808;
    color:white;
}

.stop{
    background:#d62828;
    color:white;
}

.clear{
    background:#333;
    color:white;
}

button:active{
    transform:scale(.98);
}

.status{
    margin-top:18px;
    text-align:center;
    font-size:14px;
    color:#555;
}
</style>
</head>

<body>

<div class="container">

<h1>🎙️ Text To Voice</h1>

<textarea id="text"
placeholder="यहाँ कुछ भी लिखें..."></textarea>

<label>🎤 Voice चुनें</label>

<select id="voiceSelect">
    <option>Voice loading...</option>
</select>

<label>⚡ Voice Speed</label>

<input
type="range"
id="speed"
min="0.5"
max="1.5"
step="0.1"
value="0.9"
>

<div class="buttons">

<button class="speak" onclick="speakText()">
▶ आवाज़ सुनें
</button>

<button class="stop" onclick="stopSpeech()">
⏹ रोकें
</button>

<button class="clear" onclick="clearText()">
🗑 साफ करें
</button>

</div>

<div class="status" id="status">
Ready
</div>

</div>

<script>

const textBox = document.getElementById("text");
const voiceSelect = document.getElementById("voiceSelect");
const speed = document.getElementById("speed");
const statusText = document.getElementById("status");

let voices = [];

function loadVoices(){

    voices = speechSynthesis.getVoices();

    voiceSelect.innerHTML = "";

    if(voices.length === 0){

        const option = document.createElement("option");
        option.textContent = "Voice उपलब्ध नहीं";
        voiceSelect.appendChild(option);

        return;
    }

    voices.forEach((voice,index)=>{

        const option = document.createElement("option");

        option.value = index;

        let name = voice.name;

        if(
            /female|woman|girl|zira|samantha|susan|karen|google हिन्दी|google hindi/i
            .test(name)
        ){
            name += " ⭐";
        }

        option.textContent =
            name + " (" + voice.lang + ")";

        voiceSelect.appendChild(option);

    });

    /*
    Hindi voice को पहले चुनने की कोशिश
    */

    let hindiIndex = voices.findIndex(v =>
        v.lang.toLowerCase().startsWith("hi")
    );

    if(hindiIndex >= 0){
        voiceSelect.value = hindiIndex;
    }

}

speechSynthesis.onvoiceschanged = loadVoices;

loadVoices();


function speakText(){

    const text = textBox.value.trim();

    if(!text){

        alert("कृपया पहले कुछ लिखें।");

        return;
    }

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(text);

    const selectedIndex =
        parseInt(voiceSelect.value);

    if(
        !isNaN(selectedIndex) &&
        voices[selectedIndex]
    ){

        utterance.voice =
            voices[selectedIndex];

        utterance.lang =
            voices[selectedIndex].lang;
    }

    utterance.rate =
        parseFloat(speed.value);

    utterance.pitch = 1.05;

    utterance.volume = 1;

    utterance.onstart = function(){

        statusText.textContent =
            "🔊 आवाज़ चल रही है...";
    };

    utterance.onend = function(){

        statusText.textContent =
            "✅ आवाज़ पूरी हो गई";
    };

    utterance.onerror = function(){

        statusText.textContent =
            "❌ आवाज़ चलाने में समस्या हुई";
    };

    speechSynthesis.speak(utterance);

}


function stopSpeech(){

    speechSynthesis.cancel();

    statusText.textContent =
        "⏹ आवाज़ रोक दी गई";
}


function clearText(){

    speechSynthesis.cancel();

    textBox.value = "";

    statusText.textContent =
        "Ready";
}

</script>

</body>
</html>
