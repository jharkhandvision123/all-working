<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cinematic Mirror Photo</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    overflow:hidden;

    font-family:Arial,sans-serif;

    background:
    radial-gradient(
        circle at 50% 25%,
        #ffffff 0%,
        #eef1f5 40%,
        #c8cfd8 100%
    );

    display:flex;
    justify-content:center;
    align-items:center;
}

/* MAIN SCENE */

.scene{
    width:min(95vw,700px);
    height:min(95vh,900px);

    position:relative;

    display:flex;
    justify-content:center;
    align-items:center;
}

/* TITLE */

.title{
    position:absolute;
    top:15px;
    z-index:20;

    padding:10px 20px;

    border-radius:30px;

    background:rgba(255,255,255,.65);

    backdrop-filter:blur(12px);

    box-shadow:
    0 8px 30px rgba(0,0,0,.12);

    font-size:17px;
    font-weight:bold;

    color:#222;
}

/* PHOTO AREA */

.photo-area{
    position:relative;

    width:94%;
    height:82%;

    display:flex;
    justify-content:center;
    align-items:flex-start;

    overflow:hidden;

    border-radius:20px;
}

/* MAIN PHOTO */

.main-photo{
    position:absolute;

    top:0;

    width:100%;
    height:70%;

    object-fit:contain;

    z-index:5;

    filter:
    drop-shadow(
        0 20px 25px
        rgba(0,0,0,.25)
    );

    transition:
    transform 1s ease;
}

/* MIRROR AREA */

.mirror-area{

    position:absolute;

    left:0;
    right:0;

    top:67%;

    height:33%;

    overflow:hidden;

    z-index:2;

}

/* REFLECTION */

.reflection{

    width:100%;
    height:100%;

    object-fit:contain;

    transform:

        scaleY(-1);

    opacity:.35;

    filter:
        blur(1.5px)
        brightness(.88)
        saturate(.75);

    -webkit-mask-image:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.85),
            rgba(0,0,0,.35),
            transparent 90%
        );

    mask-image:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.85),
            rgba(0,0,0,.35),
            transparent 90%
        );

}

/* MIRROR GLASS */

.glass{

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:100%;

    z-index:4;

    pointer-events:none;

    background:

        linear-gradient(
            to bottom,
            rgba(255,255,255,.05),
            rgba(255,255,255,.18),
            rgba(255,255,255,.04)
        ),

        linear-gradient(
            110deg,
            transparent 20%,
            rgba(255,255,255,.35) 45%,
            transparent 58%
        );

    mix-blend-mode:screen;

    animation:
        mirrorLight 6s
        ease-in-out
        infinite;
}

/* FLOOR SHADOW */

.floor{

    position:absolute;

    left:5%;
    right:5%;

    bottom:5%;

    height:20%;

    z-index:1;

    background:
        radial-gradient(
            ellipse,
            rgba(0,0,0,.25),
            transparent 70%
        );

    filter:blur(12px);

    transform:
        perspective(500px)
        rotateX(65deg);

}

/* CONTROLS */

.controls{

    position:absolute;

    bottom:10px;

    z-index:30;

    display:flex;

    gap:8px;

    flex-wrap:wrap;

    justify-content:center;
}

button{

    border:0;

    padding:11px 16px;

    border-radius:10px;

    background:#111;

    color:white;

    font-size:14px;

    cursor:pointer;

    box-shadow:
        0 5px 15px rgba(0,0,0,.2);
}

button:hover{
    transform:translateY(-1px);
}

.upload{

    background:white;

    color:#111;

    border:1px solid #bbb;

    padding:9px;

    border-radius:10px;

}

/* ANIMATION */

@keyframes mirrorLight{

    0%{
        transform:translateX(-30%);
        opacity:.25;
    }

    50%{
        transform:translateX(20%);
        opacity:.65;
    }

    100%{
        transform:translateX(60%);
        opacity:.25;
    }

}

@keyframes cinematicZoom{

    0%{
        transform:
            scale(1)
            translateY(0);
    }

    100%{
        transform:
            scale(1.035)
            translateY(-5px);
    }

}

/* MOBILE */

@media(max-width:600px){

    .scene{
        width:100vw;
        height:95vh;
    }

    .photo-area{
        width:96%;
    }

    .title{
        font-size:14px;
    }

    button{
        padding:9px 12px;
        font-size:13px;
    }

}

</style>

</head>

<body>

<div class="scene">

    <div class="title">
        ✨ Cinematic Mirror Reflection
    </div>


    <div class="photo-area">

        <!-- MAIN PHOTO -->

        <img
            id="mainPhoto"
            class="main-photo"
            src="photo.png"
            alt="Photo"
        >


        <!-- MIRROR -->

        <div
            id="mirrorArea"
            class="mirror-area"
        >

            <img
                id="reflection"
                class="reflection"
                src="photo.png"
                alt=""
            >

            <div class="glass"></div>

        </div>


        <!-- FLOOR -->

        <div class="floor"></div>

    </div>


    <!-- CONTROLS -->

    <div class="controls">

        <label class="upload">

            📷 फोटो बदलें

            <input
                id="photoUpload"
                type="file"
                accept="image/*"
                hidden
            >

        </label>


        <button
            onclick="toggleMirror()"
        >
            🪞 Mirror ON/OFF
        </button>


        <button
            onclick="toggleMotion()"
        >
            🎬 Cinematic Motion
        </button>

    </div>

</div>


<script>

const upload =
document.getElementById("photoUpload");

const mainPhoto =
document.getElementById("mainPhoto");

const reflection =
document.getElementById("reflection");

const mirrorArea =
document.getElementById("mirrorArea");

let mirrorOn = true;

let motionOn = false;


/* PHOTO UPLOAD */

upload.addEventListener(
    "change",
    function(){

        const file =
        this.files[0];

        if(!file){
            return;
        }

        const imageURL =
        URL.createObjectURL(file);

        mainPhoto.src =
        imageURL;

        reflection.src =
        imageURL;

    }
);


/* MIRROR ON / OFF */

function toggleMirror(){

    mirrorOn =
    !mirrorOn;

    mirrorArea.style.opacity =
    mirrorOn ? "1" : "0";

}


/* CINEMATIC MOTION */

function toggleMotion(){

    motionOn =
    !motionOn;

    if(motionOn){

        mainPhoto.style.animation =
        "cinematicZoom 5s ease-in-out infinite alternate";

    }else{

        mainPhoto.style.animation =
        "none";

    }

}

</script>

</body>
</html>
