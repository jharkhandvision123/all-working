<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Passport Photo Printer</title>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css"
/>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f6f8;
  color:#111827;
}

.container{
  max-width:1100px;
  margin:auto;
}

.card{
  background:white;
  border-radius:15px;
  padding:25px;
  box-shadow:0 5px 25px rgba(0,0,0,0.08);
}

h1{
  text-align:center;
  margin-top:0;
  color:#111827;
}

.upload-area{
  border:2px dashed #2563eb;
  border-radius:12px;
  padding:25px;
  text-align:center;
  background:#eff6ff;
}

.upload-area p{
  margin:8px 0;
}

input[type="file"]{
  display:none;
}

.file-label{
  display:inline-block;
  padding:12px 22px;
  background:#2563eb;
  color:white;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.paste-info{
  margin-top:12px;
  color:#374151;
  font-size:14px;
}

.pdf-box{
  margin-top:15px;
  padding:15px;
  background:#fff7ed;
  border:1px solid #fed7aa;
  border-radius:10px;
}

.preview-section{
  display:none;
  margin-top:25px;
}

.image-wrapper{
  max-width:700px;
  margin:auto;
  background:#111827;
  padding:10px;
  border-radius:10px;
}

#previewImage{
  display:block;
  max-width:100%;
  max-height:600px;
  margin:auto;
}

.crop-actions{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:15px;
  flex-wrap:wrap;
}

button{
  border:none;
  border-radius:8px;
  padding:12px 20px;
  font-size:16px;
  cursor:pointer;
  font-weight:bold;
}

.crop-btn{
  background:#16a34a;
  color:white;
}

.cancel-btn{
  background:#dc2626;
  color:white;
}

.start-area{
  display:none;
  text-align:center;
  margin-top:25px;
}

.start-btn{
  background:#2563eb;
  color:white;
  font-size:20px;
  padding:14px 40px;
}

.processing{
  display:none;
  text-align:center;
  margin-top:20px;
}

.loader{
  width:45px;
  height:45px;
  border:5px solid #e5e7eb;
  border-top:5px solid #2563eb;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin:10px auto;
}

@keyframes spin{
  100%{
    transform:rotate(360deg);
  }
}

.result{
  display:none;
  margin-top:25px;
  text-align:center;
}

.ready{
  display:inline-block;
  background:#16a34a;
  color:white;
  padding:8px 18px;
  border-radius:20px;
  font-weight:bold;
  margin-bottom:15px;
}

.enhanced{
  display:inline-block;
  background:#7c3aed;
  color:white;
  padding:7px 15px;
  border-radius:20px;
  font-size:14px;
  margin-left:5px;
}

.photo-preview{
  margin:15px auto;
  width:240px;
  height:300px;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
}

#finalPhoto{
  width:240px;
  height:300px;
  object-fit:cover;
  border:3px solid #000;
  background:#fff;
}

.quantity-control{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:20px;
  margin-top:20px;
}

.quantity-control button{
  width:50px;
  height:50px;
  padding:0;
  font-size:28px;
  color:white;
}

.minus{
  background:#dc2626;
}

.plus{
  background:#16a34a;
}

.quantity{
  font-size:24px;
  font-weight:bold;
  min-width:50px;
}

.status{
  margin-top:15px;
  color:#374151;
  font-weight:bold;
}

.a4-section{
  display:none;
  margin-top:35px;
}

.a4-title{
  text-align:center;
  margin-bottom:15px;
}

.a4-buttons{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.a4-size-btn{
  background:#ea580c;
  color:white;
  font-size:17px;
}

.print-btn{
  background:#6f42c1;
  color:white;
  font-size:18px;
}

.a4-wrap{
  width:100%;
  overflow:auto;
  padding:15px;
  background:#d1d5db;
  border-radius:10px;
}

.a4-page{
  width:210mm;
  min-width:210mm;
  height:297mm;
  min-height:297mm;

  background:white;

  padding:5mm;

  display:grid;

  grid-template-columns:repeat(6,30.48mm);

  grid-auto-rows:35.56mm;

  column-gap:2.5mm;
  row-gap:3mm;

  align-content:start;
  justify-content:start;

  margin:auto;
}

.a4-photo{
  width:30.48mm;
  height:35.56mm;

  object-fit:fill;

  background:white;

  border:0.6mm solid #000;

  display:block;
}

@media(max-width:600px){

  body{
    padding:10px;
  }

  .card{
    padding:15px;
  }

  .a4-wrap{
    overflow-x:auto;
  }
}

/* PRINT */

@media print{

  @page{
    size:A4 portrait;
    margin:0;
  }

  body{
    margin:0;
    padding:0;
    background:white;
  }

  .container{
    max-width:none;
  }

  .card{
    box-shadow:none;
    padding:0;
  }

  h1,
  .upload-area,
  .pdf-box,
  .preview-section,
  .start-area,
  .processing,
  .result,
  .a4-title,
  .a4-buttons{
    display:none !important;
  }

  .a4-section{
    display:block !important;
    margin:0;
  }

  .a4-wrap{
    padding:0;
    background:white;
    overflow:visible;
  }

  .a4-page{
    margin:0;
    width:210mm;
    min-width:210mm;
    height:297mm;
    min-height:297mm;
    max-height:297mm;
    box-shadow:none;
    overflow:hidden;
    break-inside:avoid;
    page-break-inside:avoid;
    break-after:avoid;
    page-break-after:avoid;
  }

  .a4-section{
    width:210mm;
    height:297mm;
    max-height:297mm;
    overflow:hidden;
    break-inside:avoid;
    page-break-inside:avoid;
    break-after:avoid;
    page-break-after:avoid;
  }
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>📸 Passport Photo Printer</h1>

<div class="upload-area">

<p><strong>Upload Photo</strong></p>

<label class="file-label" for="photoInput">
Choose Photo
</label>

<input
  type="file"
  id="photoInput"
  accept="image/*"
/>

<div class="paste-info">
या फोटो को Copy करके यहाँ <strong>Ctrl + V</strong> करें
</div>

<div class="pdf-box">
<strong>PDF Upload</strong><br><br>

<label class="file-label" for="pdfInput">
Choose PDF
</label>

<input
  type="file"
  id="pdfInput"
  accept="application/pdf"
/>

<p style="font-size:13px;">
PDF processing अगले चरण में जोड़ा जा सकता है।
</p>

</div>

</div>


<!-- CROP -->

<div
  class="preview-section"
  id="previewSection"
>

<div class="image-wrapper">

<img
  id="previewImage"
  alt="Photo Preview"
/>

</div>

<div class="crop-actions">

<button
  class="crop-btn"
  id="cropBtn"
>
✂️ Crop Photo
</button>

<button
  class="cancel-btn"
  id="cancelBtn"
>
Cancel
</button>

</div>

</div>


<!-- START -->

<div
  class="start-area"
  id="startArea"
>

<button
  class="start-btn"
  id="startBtn"
>
🚀 START
</button>

</div>


<!-- PROCESSING -->

<div
  class="processing"
  id="processing"
>

<div class="loader"></div>

<strong>
Photo Processing...
</strong>

<p>
Background Remove + White Background + HD Enhancement
</p>

</div>


<!-- RESULT -->

<div
  class="result"
  id="result"
>

<div>

<span class="ready">
✓ READY
</span>

<span class="enhanced">
✨ HD Enhanced
</span>

</div>


<div class="photo-preview">

<img
  id="finalPhoto"
  alt="Final Passport Photo"
/>

</div>


<!-- QUANTITY -->

<div class="quantity-control">

<button
  class="minus"
  id="minusBtn"
>
−
</button>

<div
  class="quantity"
  id="quantity"
>
1
</div>

<button
  class="plus"
  id="plusBtn"
>
+
</button>

</div>

<div class="status" id="status">
1 Photo Selected
</div>


<!-- A4 BUTTON -->

<div style="margin-top:20px;">

<button
  class="a4-size-btn"
  id="a4SizeBtn"
>
📄 A4 Size Layout
</button>

</div>

</div>


<!-- A4 -->

<div
  class="a4-section"
  id="a4Section"
>

<h2 class="a4-title">
A4 Size Photo Layout
</h2>

<div class="a4-buttons">

<button
  class="a4-size-btn"
  id="refreshA4Btn"
>
🔄 Update A4 Layout
</button>

<button
  class="print-btn"
  id="printBtn"
>
🖨️ Print A4
</button>

</div>


<div class="a4-wrap">

<div
  class="a4-page"
  id="a4Page"
>
</div>

</div>

</div>

</div>

</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"></script>


<script>

let cropper = null;

let finalImageData = null;

let photoQuantity = 1;

let originalImage = null;


/* ELEMENTS */

const photoInput =
  document.getElementById("photoInput");

const pdfInput =
  document.getElementById("pdfInput");

const previewSection =
  document.getElementById("previewSection");

const previewImage =
  document.getElementById("previewImage");

const cropBtn =
  document.getElementById("cropBtn");

const cancelBtn =
  document.getElementById("cancelBtn");

const startArea =
  document.getElementById("startArea");

const startBtn =
  document.getElementById("startBtn");

const processing =
  document.getElementById("processing");

const result =
  document.getElementById("result");

const finalPhoto =
  document.getElementById("finalPhoto");

const plusBtn =
  document.getElementById("plusBtn");

const minusBtn =
  document.getElementById("minusBtn");

const quantity =
  document.getElementById("quantity");

const status =
  document.getElementById("status");

const a4Section =
  document.getElementById("a4Section");

const a4Page =
  document.getElementById("a4Page");

const a4SizeBtn =
  document.getElementById("a4SizeBtn");

const refreshA4Btn =
  document.getElementById("refreshA4Btn");

const printBtn =
  document.getElementById("printBtn");


/* LOAD PHOTO */

function loadPhoto(src){

  previewImage.src = src;

  previewSection.style.display = "block";

  startArea.style.display = "none";

  result.style.display = "none";

  a4Section.style.display = "none";

  if(cropper){
    cropper.destroy();
    cropper = null;
  }

  previewImage.onload = function(){

    cropper = new Cropper(
      previewImage,
      {
        viewMode:1,
        dragMode:"move",
        autoCropArea:0.9,
        responsive:true,
        background:false
      }
    );

  };

}


/* FILE UPLOAD */

photoInput.addEventListener(
  "change",
  function(e){

    const file =
      e.target.files[0];

    if(!file) return;

    const reader =
      new FileReader();

    reader.onload =
      function(event){

        loadPhoto(
          event.target.result
        );

      };

    reader.readAsDataURL(file);

  }
);


/* PDF */

pdfInput.addEventListener(
  "change",
  function(){

    if(pdfInput.files.length){

      alert(
        "PDF upload selected. PDF photo extraction अगले चरण में जोड़ा जाएगा।"
      );

    }

  }
);


/* CTRL + V */

document.addEventListener(
  "paste",
  function(event){

    const items =
      event.clipboardData.items;

    for(
      let i=0;
      i<items.length;
      i++
    ){

      const item =
        items[i];

      if(
        item.type.indexOf("image") !== -1
      ){

        const file =
          item.getAsFile();

        const reader =
          new FileReader();

        reader.onload =
          function(e){

            loadPhoto(
              e.target.result
            );

          };

        reader.readAsDataURL(file);

        break;
      }

    }

  }
);


/* CROP */

cropBtn.addEventListener(
  "click",
  function(){

    if(!cropper) return;

    const canvas =
      cropper.getCroppedCanvas({
        width:1200,
        height:1500,
        imageSmoothingEnabled:true,
        imageSmoothingQuality:"high"
      });

    if(!canvas) return;

    originalImage =
      canvas.toDataURL(
        "image/jpeg",
        0.98
      );

    previewImage.src =
      originalImage;

    if(cropper){

      cropper.destroy();

      cropper = null;

    }

    startArea.style.display =
      "block";

    previewSection.style.display =
      "none";

    window.scrollTo({
      top:startArea.offsetTop - 20,
      behavior:"smooth"
    });

  }
);


/* CANCEL */

cancelBtn.addEventListener(
  "click",
  function(){

    if(cropper){

      cropper.destroy();

      cropper = null;

    }

    previewSection.style.display =
      "none";

    startArea.style.display =
      "none";

    photoInput.value = "";

  }
);


/* MEDIAPIPE */

const selfieSegmentation =
  new SelfieSegmentation({
    locateFile:function(file){

      return "https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/" + file;

    }
  });


selfieSegmentation.setOptions({
  modelSelection:1
});


/* PROCESS PHOTO */

async function processPhoto(){

  return new Promise(
    async function(resolve,reject){

      try{

        const img =
          new Image();

        img.onload =
          async function(){

            const width = 1800;

            const height =
              Math.round(
                width * 1.25
              );

            /*
              ENHANCEMENT CANVAS
            */

            const sourceCanvas =
              document.createElement("canvas");

            sourceCanvas.width =
              width;

            sourceCanvas.height =
              height;

            const sourceCtx =
              sourceCanvas.getContext("2d");

            sourceCtx.imageSmoothingEnabled =
              true;

            sourceCtx.imageSmoothingQuality =
              "high";

            /*
              Mild HD visual enhancement
            */

            sourceCtx.filter =
              "brightness(1.04) contrast(1.08) saturate(1.04)";

            sourceCtx.drawImage(
              img,
              0,
              0,
              width,
              height
            );

            sourceCtx.filter =
              "none";


            /*
              MEDIAPIPE
            */

            selfieSegmentation.onResults(
              function(results){

                const outputCanvas =
                  document.createElement("canvas");

                outputCanvas.width =
                  width;

                outputCanvas.height =
                  height;

                const ctx =
                  outputCanvas.getContext("2d");

                ctx.imageSmoothingEnabled =
                  true;

                ctx.imageSmoothingQuality =
                  "high";


                /*
                  BACKGROUND REMOVE + WHITE BACKGROUND
                */

                /* Draw the person mask first. */
                ctx.drawImage(
                  results.segmentationMask,
                  0,
                  0,
                  width,
                  height
                );

                /* Keep only the person from the original photo. */
                ctx.globalCompositeOperation =
                  "source-in";

                ctx.drawImage(
                  sourceCanvas,
                  0,
                  0,
                  width,
                  height
                );

                /* Put a solid white background behind the person. */
                ctx.globalCompositeOperation =
                  "destination-over";

                ctx.fillStyle =
                  "#ffffff";

                ctx.fillRect(
                  0,
                  0,
                  width,
                  height
                );

                ctx.globalCompositeOperation =
                  "source-over";


                /*
                  BLACK BORDER
                */

                ctx.strokeStyle =
                  "#000000";

                ctx.lineWidth =
                  4;

                ctx.strokeRect(
                  5,
                  5,
                  width - 4,
                  height - 4
                );


                /*
                  FINAL IMAGE
                */

                const data =
                  outputCanvas.toDataURL(
                    "image/jpeg",
                    0.99
                  );

                resolve(data);

              }
            );


            await selfieSegmentation.send({
              image:sourceCanvas
            });

          };


        img.onerror =
          reject;

        img.src =
          originalImage;

      }
      catch(error){

        reject(error);

      }

    }
  );

}


/* START */

startBtn.addEventListener(
  "click",
  async function(){

    if(!originalImage){

      alert(
        "पहले फोटो Crop करें।"
      );

      return;

    }

    startArea.style.display =
      "none";

    processing.style.display =
      "block";

    result.style.display =
      "none";

    try{

      finalImageData =
        await processPhoto();

      finalPhoto.src =
        finalImageData;

      processing.style.display =
        "none";

      result.style.display =
        "block";

      photoQuantity =
        1;

      quantity.textContent =
        photoQuantity;

      status.textContent =
        "1 Photo Selected";

      buildA4Layout();

    }
    catch(error){

      console.error(error);

      processing.style.display =
        "none";

      startArea.style.display =
        "block";

      alert(
        "Photo processing में समस्या हुई। कृपया फिर से कोशिश करें।"
      );

    }

  }
);


/* PLUS */

plusBtn.addEventListener(
  "click",
  function(){

    if(!finalImageData) return;

    photoQuantity++;

    quantity.textContent =
      photoQuantity;

    status.textContent =
      photoQuantity
      + " Photos Selected";

    buildA4Layout();

  }
);


/* MINUS */

minusBtn.addEventListener(
  "click",
  function(){

    if(photoQuantity <= 1){

      return;

    }

    photoQuantity--;

    quantity.textContent =
      photoQuantity;

    status.textContent =
      photoQuantity
      + " Photos Selected";

    buildA4Layout();

  }
);


/* A4 LAYOUT */

function buildA4Layout(){

  if(!finalImageData){

    return;

  }

  a4Page.innerHTML = "";


  for(
    let i=0;
    i<photoQuantity;
    i++
  ){

    const img =
      document.createElement("img");

    img.className =
      "a4-photo";

    img.src =
      finalImageData;

    img.alt =
      "Passport Photo "
      + (i + 1);

    a4Page.appendChild(img);

  }

}


/* A4 SIZE BUTTON */

a4SizeBtn.addEventListener(
  "click",
  function(){

    if(!finalImageData){

      alert(
        "पहले START दबाकर फोटो READY करें।"
      );

      return;

    }

    buildA4Layout();

    a4Section.style.display =
      "block";

    setTimeout(
      function(){

        a4Section.scrollIntoView({
          behavior:"smooth",
          block:"start"
        });

      },
      100
    );

  }
);


/* UPDATE A4 */

refreshA4Btn.addEventListener(
  "click",
  function(){

    buildA4Layout();

  }
);


/* PRINT */

printBtn.addEventListener(
  "click",
  function(){

    if(!finalImageData){

      alert(
        "पहले फोटो READY करें।"
      );

      return;

    }

    buildA4Layout();

    window.print();

  }
);

</script>

</body>
</html>
